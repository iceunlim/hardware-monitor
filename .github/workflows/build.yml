name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 公共仓库的标准 macOS runner 免费，arm64 与 Intel 各出一个产物。
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app
        run: bash Scripts/build.sh release

      - name: Verify bundle
        run: codesign --verify --deep --strict --verbose=2 build/GlassMonitor.app

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/GlassMonitor.app build/GlassMonitor.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassMonitor-macos26-${{ matrix.arch }}
          path: build/GlassMonitor.zip
          if-no-files-found: error
